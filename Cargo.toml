[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/data",
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
evr-core = { path = "crates/core" }
evr-data = { path = "crates/data" }
evr-protocol = { path = "crates/protocol" }
evr-server = { path = "crates/server" }

bevy = "0.19"
bevy_replicon = "0.41"
bevy_replicon_renet2 = { version = "0.19.1", features = [
    "memory_transport",
    "native_transport",
] }
glam = "0.32"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.5", features = ["server", "transport-io"] }
rusqlite = { version = "0.33", features = ["bundled"] }
argon2 = "0.5"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"