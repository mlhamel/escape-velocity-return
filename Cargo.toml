[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/data",
    "crates/protocol",
    "crates/server",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
evr-core = { path = "crates/core" }
evr-data = { path = "crates/data" }
evr-protocol = { path = "crates/protocol" }
evr-server = { path = "crates/server" }

bevy = "0.19"
bevy_replicon = "0.41"
bevy_replicon_renet2 = { version = "0.19.1", features = ["memory_transport"] }
glam = "0.32"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"